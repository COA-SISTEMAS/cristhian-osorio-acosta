name: Optimizar imágenes de la exposición

on:
  workflow_dispatch:
  push:
    paths:
      - '*.png'
      - '*.jpg'
      - '*.jpeg'
      - '.github/workflows/optimize-images.yml'

permissions:
  contents: write

concurrency:
  group: optimizar-imagenes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Instalar Sharp
        run: npm install --no-save --no-package-lock sharp@0.33.5

      - name: Generar miniaturas y versiones WebP
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');

          const files = fs.readdirSync('.')
            .filter(file => /\.(png|jpe?g)$/i.test(file))
            .sort((a, b) => a.localeCompare(b, 'es'));

          fs.mkdirSync('thumbs', { recursive: true });
          fs.mkdirSync('optimized', { recursive: true });

          (async () => {
            let generated = 0;
            for (const file of files) {
              const stat = fs.statSync(file);
              if (stat.size < 100) {
                console.warn(`Omitido por tamaño insuficiente: ${file} (${stat.size} bytes)`);
                continue;
              }

              const base = path.basename(file, path.extname(file));
              const thumb = path.join('thumbs', `${base}.webp`);
              const full = path.join('optimized', `${base}.webp`);

              await sharp(file)
                .rotate()
                .resize({ width: 800, height: 800, fit: 'inside', withoutEnlargement: true })
                .webp({ quality: 76, effort: 6 })
                .toFile(thumb);

              await sharp(file)
                .rotate()
                .resize({ width: 1800, height: 1800, fit: 'inside', withoutEnlargement: true })
                .webp({ quality: 84, effort: 6 })
                .toFile(full);

              generated++;
              console.log(`${file} -> ${thumb} + ${full}`);
            }

            if (!generated) throw new Error('No se generó ninguna imagen.');
            console.log(`Total de originales optimizados: ${generated}`);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Guardar versiones optimizadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thumbs optimized
          git diff --cached --quiet || git commit -m "Optimiza imágenes de la exposición"
          git push
