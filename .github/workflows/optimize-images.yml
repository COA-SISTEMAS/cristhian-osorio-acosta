name: Optimizar imágenes de la exposición

on:
  workflow_dispatch:
  push:
    paths:
      - '*.png'
      - '*.jpg'
      - '*.jpeg'
      - 'index.html'
      - '.github/workflows/optimize-images.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Sharp
        run: npm install --no-save sharp@0.33.5

      - name: Generar miniaturas y versiones WebP
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');

          const files = fs.readdirSync('.').filter(file => /\.(png|jpe?g)$/i.test(file));
          fs.mkdirSync('thumbs', { recursive: true });
          fs.mkdirSync('optimized', { recursive: true });

          (async () => {
            for (const file of files) {
              const stat = fs.statSync(file);
              if (stat.size < 100) {
                console.log(`Omitido por tamaño: ${file}`);
                continue;
              }

              const base = path.basename(file, path.extname(file));
              const thumb = path.join('thumbs', `${base}.webp`);
              const full = path.join('optimized', `${base}.webp`);

              await sharp(file)
                .resize({ width: 800, height: 800, fit: 'inside', withoutEnlargement: true })
                .webp({ quality: 76, effort: 6 })
                .toFile(thumb);

              await sharp(file)
                .resize({ width: 1800, height: 1800, fit: 'inside', withoutEnlargement: true })
                .webp({ quality: 84, effort: 6 })
                .toFile(full);

              console.log(`${file} -> ${thumb} + ${full}`);
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Guardar versiones optimizadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thumbs optimized
          git diff --cached --quiet || git commit -m "Genera miniaturas y WebP optimizados"
          git push
