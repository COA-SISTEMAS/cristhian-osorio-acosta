name: Corregir desplazamiento horizontal

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bloquear desplazamiento horizontal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "html{scroll-behavior:smooth;background:var(--paper);-webkit-text-size-adjust:100%}body{background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif;font-weight:300;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}"
          new = "html{scroll-behavior:smooth;background:var(--paper);-webkit-text-size-adjust:100%;width:100%;max-width:100%;overflow-x:clip;overscroll-behavior-x:none}body{background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif;font-weight:300;line-height:1.6;width:100%;max-width:100%;overflow-x:clip;overscroll-behavior-x:none;touch-action:pan-y pinch-zoom;-webkit-font-smoothing:antialiased}"
          if old not in s:
              raise SystemExit('No se encontró el bloque CSS esperado; no se modifica el sitio.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Guardar cambio y eliminar este workflow temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-mobile-horizontal-scroll.yml
          git commit -m "Bloquea desplazamiento horizontal en móviles"
          git push
