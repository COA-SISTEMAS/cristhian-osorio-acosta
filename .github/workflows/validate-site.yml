name: Validar sitio

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'audit/**']
    paths:
      - 'index.html'
      - '.github/workflows/**'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: validar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Comprobar HTML, catálogo y enlaces
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          source = Path("index.html").read_text(encoding="utf-8")
          required = [
              'lang="es"', 'id="inicio"', 'id="obra"', 'id="sobre"',
              'id="contacto"', 'id="works"', 'id="lb"',
              'https://wa.me/50496775363',
              'mailto:cristhianosorio503@gmail.com',
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit("Faltan elementos requeridos: " + ", ".join(missing))

          catalog = re.search(r"const W=\\[(.*?)\\n\\]\\.map", source, re.S)
          if not catalog:
              raise SystemExit("No se encontró el catálogo.")
          entries = re.findall(r"^\\['", catalog.group(1), re.M)
          if len(entries) != 16:
              raise SystemExit(f"Catálogo incorrecto: {len(entries)} obras; se esperaban 16.")

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "id" in attrs:
                      self.ids.append(attrs["id"])
                  if tag == "a" and attrs.get("href", "").startswith("#"):
                      self.links.append(attrs["href"][1:])

          parser = Parser()
          parser.feed(source)
          duplicates = sorted({x for x in parser.ids if parser.ids.count(x) > 1})
          if duplicates:
              raise SystemExit("IDs HTML duplicados: " + ", ".join(duplicates))
          missing_targets = sorted(set(parser.links) - set(parser.ids))
          if missing_targets:
              raise SystemExit("Enlaces internos sin destino: " + ", ".join(missing_targets))
          print("OK: HTML parseable, 16 obras, IDs únicos y enlaces internos válidos.")
          PY

      - name: Comprobar sintaxis JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", source, re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Se esperaba 1 script inline y se encontraron {len(scripts)}.")
          Path("/tmp/site-inline.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/site-inline.js
