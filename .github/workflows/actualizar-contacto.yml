name: Validar contacto y estructura del sitio

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/actualizar-contacto.yml'

permissions:
  contents: read

concurrency:
  group: validar-sitio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validar contenido publicado
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")
          required = [
              'lang="es"',
              'id="inicio"',
              'id="obra"',
              'id="sobre"',
              'id="contacto"',
              'https://wa.me/50496775363',
              'mailto:cristhianosorio503@gmail.com',
              'id="works"',
              'id="lb"',
          ]

          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit("Faltan elementos requeridos: " + ", ".join(missing))

          catalog = re.search(r"const W=\[(.*?)\n\]\.map", html, re.S)
          if not catalog:
              raise SystemExit("No se encontró el catálogo de obras.")

          works = re.findall(r"^\['", catalog.group(1), re.M)
          if len(works) != 17:
              raise SystemExit(f"Se esperaban 17 obras y se encontraron {len(works)}.")

          print(f"Validación correcta: {len(works)} obras y enlaces principales presentes.")
          PY
